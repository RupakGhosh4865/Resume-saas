# Standalone run of the Resume Optimizer only.
# In the full product the optimizer is a service in the root docker-compose.yml;
# use that unless you are working on this component in isolation.

services:
  backend:
    build:
      context: ./backend
    container_name: resume_optimizer_backend
    ports:
      - "8002:8002"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_QUALITY=${OPENAI_MODEL_QUALITY:-gpt-4o}
      - OPTIMIZER_ALLOWED_ORIGINS=${OPTIMIZER_ALLOWED_ORIGINS:-http://localhost:5000}
      - DB_PATH=/app/data/resume_history.db
    volumes:
      - resume_db:/app/data

  frontend:
    build:
      context: ./frontend
    container_name: resume_optimizer_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  resume_db:
